# Блок настроек Istio Ingress MTLS/OTT MTLS. Optional (Если требуются геороуты или кастомные роуты, то задать эти параметры можно в этом блоке)
  # Каждый маршрут (ingress) указывается в формате:
  # <route-name>:          # название должно быть таким же как AGENT_NAME в конфигурации агента, чтобы трафик шёл по конкретному роуту в конкретного агента
    # HOST: <fqdn-host>    # полный домен для входящего запроса
    # PORT: <mesh-port>    # виртуальный порт в ServiceMesh (указывается уникальный для каждого роута)
    # GEOROUTES:           # геораспределённые маршруты (optional)
    #  <georoute-name>:    # название может быть произвольным, рекомендуется указывать geo-{название агента}, геороут будет привязан к агенту
    #    HOST: <fqdn-georoute-host> # полный домен для входящего запроса
    #    PORT: <georoute-port>     # виртуальный порт в ServiceMesh (указывается уникальный для каждого роута)

  # 1 Агент : 1 кластерый роут  1 Агент : N героутов
  # Agent 1
  #  |__ Cluster Route/Ingress
  #  |__ GeoRoute 1
  #  |__ GeoRoute 2
  # Agent 2
  #  |__ Cluster Route/Ingress
  #  |__ GeoRoute 1
  #  |__ GeoRoute 2

# Пример конфигурации Istio Ingress MTLS/OTT MTLS. Optional
ISTIO:
  INGRESS:
    CONNECT_TIMEOUT: 60s # таймаут соединения с upstream-сервером
    READ_TIMEOUT: 60s # таймаут между двумя последовательными чтениями данных от upstream-сервера после успешного подключения
    SEND_TIMEOUT: 60s # таймаут между двумя последовательными попытками отправки данных от Nginx к upstream-серверу
    NETWORKING_MTLS: # Роуты без OTT
      patterns-agent: # route-name название должно быть таким же как AGENT_NAME в конфигурации агента, чтобы трафик шёл по конкретному роуту в конкретного агента
        HOST: patterns3-agent.apps.a2kb5nzq.k8s.delta.sbrf.ru # полный домен для входящего запроса
        PORT: 5443  # виртуальный порт в ServiceMesh (указывается уникальный для каждого роута)
        GEOROUTES:  # геораспределённые маршруты (optional)
          georoute-patterns-agent: # название может быть произвольным, рекомендуется указывать geo-{название агента}, геороут будет привязан к агенту
            HOST: aef-georoute-patterns-agent.apps.a2kb5nzq.k8s.delta.sbrf.ru
            PORT: 2442
          georoute-patterns-agent-2:
            HOST: aef-georoute-patterns-agent-2.apps.a2kb5nzq.k8s.delta.sbrf.ru
            PORT: 2443
    NETWORKING_OTT_MTLS:  # Роуты с ОТТ (optional)
      patterns-agent:
        HOST: patterns3-ott-agent.apps.a2kb5nzq.k8s.delta.sbrf.ru
        PORT: 5445
        GEOROUTES:  # геораспределённые маршруты (optional)
          georoute-patterns-agent:
            HOST: aef-georoute-patterns-agent-ott.apps.a2kb5nzq.k8s.delta.sbrf.ru
            PORT: 2446

