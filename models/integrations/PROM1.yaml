# Список интеграций TCP (Например Kafka)(Открывает дырку в Egress). Optional
KAFKA:
  CLUSTERS:
    - NAME: aef-istio-logs
      HOSTS: # Необходимо заполнить в соответствии с хабом и стендом. Список тут: https://confluence.delta.sbrf.ru/pages/viewpage.action?pageId=15337954518
        - HOST: pvloq-btaaf0006.omega.sbrf.ru
          PORT: 9093
        - HOST: pvloq-btaaf0008.omega.sbrf.ru
          PORT: 9093
        - HOST: pvloq-btaaf0009.omega.sbrf.ru
          PORT: 9093
        - HOST: pvloq-btaaf0007.omega.sbrf.ru
          PORT: 9093
      MESH_PORT: 19093
      PROTOCOL: kafka

