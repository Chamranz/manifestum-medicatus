# Блок настроек Secman. Optional все параметры снизу могут быть использованы по умолчанию,
# если соблюдалась инструкция при заказе движков SecMan.
# Для openshift нужно явно указать путь до серверного движка
SECMAN:
  # ссылка на SecMan
  HOST: "ift.secrets.ca.sbrf.ru"
  # имя namespace dropapp
  ROLE_NAME: "ci09708620-claim-terms"
  # namespace secman
  NAMESPACE: "CI08967393_CI09889001"
  # путь до truststore ott
  CERT_KV_PATH: "CI08967393_CI09889001/A/CI09708620/JEN/MAIN/KV/certs"
  # путь до серверного движка
  SBER_CA_KV_SERVER_PATH: "CI08967393_CI09889001/SBERCA/sberca-test-int-g2/fetch/server_3y_AS_rsa"
  # путь до клиентского движка
  SBER_CA_KV_CLIENT_PATH: "CI08967393_CI09889001/SBERCA/sberca-test-int-g2/fetch/client_1y_APPLAYER_rsa"
  # путь до секретных переменных окружения. Имена секретов внутри должно совпадать с именами в SECRET_ENV в agent.yaml
#  ENV_KV_PATH: "CI06064378_CI08423996/A/AEF/OSH/AEF/KV/SECRET_ENV"
  # CN сертификата, по умолчанию вида КЭФП-СТЕНД-КЭМодуля-ИмяАгента
  SBER_CA_CLIENT_CN: "CI09708620-CI10662999-claim-terms-psi"
  # серверный CN = равен 1му SAN
  SBER_CA_SERVER_CN: >-
    claim-terms.ci09708620-claim-terms.apps.a472facr.k8s.omega.sbrf.ru
  # CN сертификата OTT, должен совпадать с OTT.BILLING_ACCOUNT
  SBER_CA_OTT_CN: "CI09708620-CI10662999-OTTYUL"
  # путь до движка с SECMAN
  SBER_CA_KV_OTT_CLIENT_PATH: "CI08967393_CI09889001/SBERCA/sberca-test2-int-ec/fetch/client_1y_APPLAYER_ec"
  # Путь до файлов с секретами в secman
#  SECRETS_KV_PATH: "CI06064378_CI08423996/A/AEF/OSH/AEF/KV/SECRET_FILES"
  #  Optional # используется для geo. Присмер заполнения:
  #INGRESS_GW_SAN: >-
  # patterns-agent.dev4.apps.azwx5oj1.k8s.delta.sbrf.ru,patterns-agent-ott.dev4.apps.azwx5oj1.k8s.delta.sbrf.ru
  INGRESS_GW_SAN: >-
    claim-terms-kvaefdrpa-psi.omega.sbrf.ru,claim-terms-ott.ci09708620-claim-terms.apps.a472facr.k8s.omega.sbrf.ru,claim-terms-ott.ci09708620-claim-terms.apps.a47ow1gr.k8s.ca.sbrf.ru,claim-terms.ci09708620-claim-terms.apps.a472facr.k8s.omega.sbrf.ru
  # Наименование файлов с секретами. Секреты будут размещены в поде по пути /vault/secrets/secret-files. Формат файлов
  # свободный. (должно совпадать с ключами секретов расположенными по пути указанному в SECRETS_KV_PATH.
  # Если название не совпадёт, будет создан пустой файл)
  #Optional
  # путь до egress_custom_ca_cert.pem
  #EGRESS_CUSTOM_CA_KV_PATH: "CI06064378_CI08423996/A/AEF/OSH/AEF/KV/certs"
  #Optional
  # путь до ingress_custom_ca_cert.pem
  #INGRESS_CUSTOM_CA_KV_PATH: "CI06064378_CI08423996/A/AEF/OSH/AEF/KV/certs"
  #SECRET_FILES:
  #  - secret1
  #  - secret2
ISTIO:
  INGRESS:
    NETWORKING_MTLS: # Роуты без OTT
      claim-terms: # route-name название должно быть таким же как AGENT_NAME в конфигурации агента, чтобы трафик шёл по конкретному роуту в конкретного агента
        HOST: claim-terms.ci09708620-claim-terms.apps.a472facr.k8s.omega.sbrf.ru # полный домен для входящего запроса
        PORT: 5443  # виртуальный порт в ServiceMesh (указывается уникальный для каждого роута)
#        GEOROUTES:  # геораспределённые маршруты (optional)
#          georoute-claim-terms: # название может быть произвольным, рекомендуется указывать geo-{название агента}, геороут будет привязан к агенту
#            HOST: claim-terms-kvaefdrpa-psi.omega.sbrf.ru
#            PORT: 2442
    NETWORKING_OTT_MTLS: # Роуты с ОТТ (optional)
      claim-terms:
        HOST: claim-terms-ott.ci09708620-claim-terms.apps.a472facr.k8s.omega.sbrf.ru
        PORT: 5445
        GEOROUTES: # геораспределённые маршруты (optional)
          georoute-claim-terms: # название может быть произвольным, рекомендуется указывать geo-{название агента}, геороут будет привязан к агенту
            HOST: claim-terms-kvaefdrpa-psi.omega.sbrf.ru
            PORT: 2446
